<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Produto · Casas Pedro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Página pública aberta pelo QR Code da etiqueta: só informação de produto, pensada para celular */
:root{
  --bg:#f7f3ec; --surface:#fffdf9; --ink:#2a2118; --muted:#7a6b5c; --line:#e8dfd2;
  --brand:#16284f; --accent:#d9661b; --leaf:#2f7a4a; --leaf-soft:#e4f1e7;
  --f-display:"Fraunces",Georgia,serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
.top{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;display:flex;align-items:center;justify-content:space-between;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.top b{font-family:var(--f-display);font-size:1rem;letter-spacing:.02em;text-transform:none}
main{max-width:560px;margin:0 auto;padding:0 0 40px}
.hero{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--h1,#c9a46a)}
.hero img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:
  radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 45%),
  radial-gradient(circle at 85% 90%,rgba(0,0,0,.18),transparent 50%),
  linear-gradient(135deg,var(--h1),var(--h2))}
.ph span{font-family:var(--f-display);font-weight:800;font-size:clamp(3.2rem,18vw,6rem);color:rgba(255,255,255,.9);letter-spacing:-.02em;text-shadow:0 2px 18px rgba(0,0,0,.15)}
.ph small{position:absolute;bottom:14px;left:18px;color:rgba(255,255,255,.92);font-weight:600;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.head{background:var(--surface);margin:-28px 14px 0;position:relative;z-index:2;border-radius:18px;padding:20px 20px 18px;box-shadow:0 6px 28px rgba(60,40,10,.10)}
.cat{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.15;margin:6px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--leaf-soft);color:var(--leaf)}
.tag.n{background:#f1ebe2;color:var(--muted)}
.lead{margin:14px 0 0;color:#4a3d30}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:14px 14px 10px;background:linear-gradient(var(--bg) 75%,transparent);scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:600}
.blk{background:var(--surface);margin:12px 14px 0;border-radius:16px;padding:18px 20px;scroll-margin-top:60px}
.blk h2{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.blk h2 i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:.95rem;background:#f6e6d8;color:var(--accent);flex:none}
.blk p{margin:0;white-space:pre-line}
.ale{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fbefd9;color:#7a4b00;font-size:.85rem;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.in{padding-left:18px;color:#5a4c3e}
tr.kc td{font-weight:700}
.foot{font-size:.74rem;color:var(--muted);margin-top:10px}
.share{display:flex;gap:8px;margin:16px 14px 0}
.share a,.share button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font:700 .9rem var(--f-body);cursor:pointer}
.wa{background:#1f8f4e;color:#fff}
.cp{background:var(--surface);color:var(--ink);border:1px solid var(--line)!important}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:26px;padding:0 20px}
.msg{padding:60px 24px;text-align:center}
.msg h1{font-size:1.4rem}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="top"><b>Casas Pedro</b><span>Produto a granel</span></div>
<main id="app"><div class="msg"><p>Carregando produto…</p></div></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR');
const NU = [['Valor energético','kcal'],['Carboidratos','g'],['Proteínas','g'],['Gorduras totais','g'],['Gorduras saturadas','g',1],['Gorduras trans','g',1],['Fibra alimentar','g'],['Sódio','mg']];
// Cores da capa por categoria (usada enquanto o produto não tem foto)
const HUE = {'Temperos & Condimentos':['#c4552b','#8f2f1a'],'Castanhas & Oleaginosas':['#a87444','#6e4526'],'Grãos':['#c79a3e','#8a6420'],'Frutas':['#d9762e','#a3401f'],
  'Ervas & Chás':['#5f8f4e','#2f5a2c'],'Farinhas':['#c9ad7c','#8f7448'],'Superalimentos & Energéticos':['#7c4f8f','#4a2a5e'],'Chocolates':['#7a4a32','#43261a'],
  'Doces & Balas':['#d0587a','#913452'],'Aperitivos':['#d38a2e','#99561a'],'Suplementos':['#3f7d8f','#22505e'],'Mel':['#d7a12c','#9a6b12']};
const params = new URLSearchParams(location.search);
const code = (params.get('c') || '').replace(/\D/g, '').padStart(6, '0');

function page(i){
  const nm = String(i.t || i.d).replace(/\s+KG\.?$/i, ''), f = i.fl || [], tags = [];
  if (f[3] === 'S') tags.push('Vegano'); else if (f[2] === 'S') tags.push('Vegetariano');
  if (f[1] === 'S') tags.push('Orgânico');
  if (f[0] === 'N') tags.push('Sem lactose');
  const [h1, h2] = HUE[i.cat] || ['#b08a55', '#7a5a32'];
  const ini = nm.replace(/\b(KG|C\/|S\/|DE|DA|DO|EM)\b/gi, '').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const pl = i.pt || `${fmt(i.por)} ${i.pu || 'g'}`;
  const blocks = [
    i.ben && ['ben', 'Benefícios', '✦', `<p>${esc(i.ben)}</p>`],
    i.ind && ['uso', 'Como usar', '⟡', `<p>${esc(i.ind)}</p>`],
    (i.ing || i.ale) && ['ing', 'Ingredientes', '❖', `${i.ing ? `<p>${esc(i.ing)}</p>` : ''}${i.ale ? `<div class="ale">Alergênicos: ${esc(i.ale)}</div>` : ''}`],
    i.nf && ['nut', 'Informação nutricional', '◎', `<table><thead><tr><th>Porção de ${esc(pl)}</th><th>Qtd.</th><th>%VD*</th></tr></thead><tbody>
      ${NU.map(([n,u,sub],k) => `<tr class="${k ? '' : 'kc'}"><td${sub ? ' class="in"' : ''}>${n}</td><td>${fmt(i.nu[k])} ${u}</td><td>${n === 'Gorduras trans' ? '**' : fmt(i.vd[k]) + '%'}</td></tr>`).join('')}
      </tbody></table><p class="foot">*% Valores Diários com base em uma dieta de 2.000 kcal. **VD não estabelecido.</p>`]
  ].filter(Boolean);
  document.title = nm + ' · Casas Pedro';
  const share = `${nm}\n${location.href}`;
  $('app').innerHTML = `
    <div class="hero" style="--h1:${h1};--h2:${h2}">
      <div class="ph"><span>${esc(ini)}</span></div>
      <img alt="${esc(nm)}" src="fotos/${i.s}.jpg" onerror="this.remove()">
    </div>
    <section class="head">
      <div class="cat">${esc(i.cat || 'Produto')}${i.sub ? ' · ' + esc(i.sub) : ''}</div>
      <h1>${esc(nm)}</h1>
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
      ${i.sob ? `<p class="lead">${esc(i.sob)}</p>` : ''}
    </section>
    ${blocks.length > 1 ? `<nav class="nav" aria-label="Seções">${blocks.map(b => `<a href="#${b[0]}">${b[1]}</a>`).join('')}</nav>` : ''}
    ${blocks.map(b => `<section class="blk" id="${b[0]}"><h2><i aria-hidden="true">${b[2]}</i>${b[1]}</h2>${b[3]}</section>`).join('')}
    <div class="share">
      <a class="wa" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">Compartilhar no WhatsApp</a>
      <button class="cp" type="button" id="cpl">Copiar link</button>
    </div>
    <footer>Cód. ${i.s} · Informações fornecidas pela Casas Pedro.<br>Imagem meramente ilustrativa.</footer>`;
  $('cpl').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('cpl').textContent = 'Link copiado'; } catch { $('cpl').textContent = 'Não foi possível copiar'; } };
}
function fail(t){ $('app').innerHTML = `<div class="msg"><h1>${t}</h1><p>Confira o QR Code da etiqueta ou fale com um atendente da loja.</p></div>`; }

if (!/^\d{6}$/.test(code) || code === '000000') fail('Produto não informado');
else fetch(`prod/${code}.json`).then(r => r.ok ? r.json() : Promise.reject()).then(page).catch(() => fail('Produto não encontrado'));
</script>
</body>
</html>
