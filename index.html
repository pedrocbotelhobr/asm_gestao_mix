<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--navy:#0f2240;--blue:#1a5276;--accent:#e67e22;--green:#27ae60;--red:#c0392b;--gold:#e67e00;--salmon:#e8603c;--purple:#9b59b6;--bg:#f0f3f8;--card:#fff;--text:#1a1a2e;--muted:#7f8c8d;--border:#dce3ec}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{background:var(--navy);padding:14px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr h1{font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:#fff}.hdr p{font-size:11px;color:#8eafd4;margin-top:1px}
.back-btn{background:rgba(255,255,255,.12);border:none;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;margin-bottom:8px;display:none;font-family:'DM Sans',sans-serif}.back-btn.vis{display:inline-block}
.sels{padding:12px 16px;background:var(--navy);display:flex;flex-direction:column;gap:9px;border-bottom:3px solid var(--accent)}
.sw label{font-size:10px;font-weight:600;color:#8eafd4;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:4px}.sw{position:relative}
select{width:100%;padding:10px 34px 10px 12px;border-radius:10px;border:1.5px solid #2c4a6e;background:#162d4a;color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}
select:focus{border-color:var(--accent)}select option{background:#162d4a}.arr{position:absolute;right:11px;bottom:11px;color:#8eafd4;font-size:10px;pointer-events:none}
.wrap{padding:14px 16px;max-width:560px;margin:0 auto}
.vkpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:12px;padding:13px 14px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.kpi .n{font-family:'DM Sans',sans-serif;font-size:24px;font-weight:800;color:var(--navy);line-height:1}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.kpi.r .n{color:var(--red)}.kpi.g .n{color:var(--green)}.kpi.o .n{color:var(--gold)}
.pgwrap{margin-bottom:13px}.pglbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.pgbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.pgfill{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:3px;transition:width .4s}
.stl{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:16px 0 9px;display:flex;align-items:center;gap:8px}.stl::after{content:'';flex:1;height:1px;background:var(--border)}
.tbl-wrap{overflow-x:auto;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;background:var(--card)}
thead tr{background:var(--navy)}
th{color:#fff;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:9px 7px;text-align:center;letter-spacing:.4px;white-space:nowrap;cursor:pointer;user-select:none;transition:background .15s}
th:first-child{text-align:left;padding-left:11px}th:hover{background:#1a3a5c}
.si{margin-left:3px;opacity:.45;font-size:9px}th.srt .si{opacity:1}
td{padding:8px 7px;font-size:12px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle;cursor:pointer}
td:first-child{text-align:left;padding-left:11px;font-weight:600;max-width:155px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:none}tbody tr:nth-child(even) td{background:#f7f9fc}tbody tr:hover td{background:var(--bg)}
.cnt{display:inline-block;border-radius:5px;padding:2px 6px;font-size:11px;font-weight:700;min-width:20px;text-align:center}
.cnt.r{background:#fdecea;color:var(--red)}.cnt.o{background:#fef5e4;color:var(--gold)}.cnt.s{background:#fde8e1;color:var(--salmon)}.cnt.p{background:#f3e5f5;color:var(--purple)}.cnt.gn{background:#eafaf1;color:var(--green)}
.clichdr{background:var(--card);border-radius:14px;padding:14px;margin-bottom:13px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid var(--accent)}
.clichdr h2{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--navy);line-height:1.3}
.climeta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.mb{background:var(--bg);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;color:var(--muted)}.mb span{color:var(--text);font-size:12px}
.spills{display:flex;gap:7px;margin-bottom:13px}
.sp{flex:1;background:var(--card);border-radius:10px;padding:10px 5px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sp .n{font-family:'DM Sans',sans-serif;font-size:18px;font-weight:800;color:var(--navy);display:block}
.sp .l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.sp.r .n{color:var(--red)}.sp.g .n{color:var(--green)}.sp.o .n{color:var(--gold)}.sp.p .n{color:var(--purple)}
.tabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tab{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid var(--border);background:var(--card);color:var(--muted);flex-shrink:0;transition:all .15s}.tab.act{background:var(--navy);color:#fff;border-color:var(--navy)}
.leg{background:var(--card);border-radius:11px;padding:12px;margin-bottom:13px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ltl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px}
.litems{display:flex;flex-wrap:wrap;gap:8px}.li{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500}.ld{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.glist{display:flex;flex-direction:column;gap:8px}
.gc{background:var(--card);border-radius:11px;padding:12px;box-shadow:0 1px 5px rgba(0,0,0,.06);display:flex;align-items:flex-start;gap:10px;border-left:4px solid transparent;transition:transform .12s,opacity .2s}.gc:active{transform:scale(.98)}
.gc.p1{border-left-color:var(--red)}.gc.p2{border-left-color:var(--gold)}.gc.p3{border-left-color:var(--salmon)}.gc.p4{border-left-color:var(--purple)}
.gc.done-c{opacity:.4}.gc.na-c{opacity:.28;filter:grayscale(.8)}
.rb{min-width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:800;flex-shrink:0}
.p1 .rb{background:#fdecea;color:var(--red)}.p2 .rb{background:#fef5e4;color:var(--gold)}.p3 .rb{background:#fde8e1;color:var(--salmon)}.p4 .rb{background:#f3e5f5;color:var(--purple)}
.gi{flex:1;min-width:0}.gn{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}.gcat{font-size:11px;color:var(--muted);margin-top:2px}
.gst{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.pill{background:var(--bg);border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;color:var(--muted)}.pill strong{color:var(--text)}
.abns{display:flex;flex-direction:column;gap:4px;flex-shrink:0;align-self:center}
.ab{border:none;border-radius:7px;padding:7px 9px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:background .15s;white-space:nowrap;min-width:52px;text-align:center}
.ab.add{background:var(--navy);color:#fff}.ab.add.act{background:var(--green)}
.ab.na{background:#f0f3f8;color:var(--muted);border:1px solid var(--border)}.ab.na.act{background:#fdecea;color:var(--red);border-color:#f5c6c6}
.ph{text-align:center;padding:50px 20px;color:var(--muted)}.ph .ico{font-size:42px;margin-bottom:12px}
.ph h3{font-family:'Syne',sans-serif;font-size:14px;color:var(--text);margin-bottom:6px}.ph p{font-size:12px;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3);opacity:0;transition:opacity .3s;z-index:999;white-space:nowrap}.toast.show{opacity:1}</style>

  var tO=0,tA=0,tN=0,cC=0;
  entries.forEach(function(e){var c=e[0],info=e[1],st=state[K(curV,c)]||{};
    info.g.forEach(function(g){if(st[g.r]==='add')tA++;else if(st[g.r]==='na')tN++;else tO++;});
    if(info.g.filter(function(g){return g.r<=10&&!st[g.r];}).length>0)cC++;
  });
  var tG=tO+tA+tN,pct=tG>0?Math.round((tA+tN)/tG*100):0;
  var sorted=entries.slice().sort(function(a,b){var av=getSV(a),bv=getSV(b);return typeof av==='string'?sDir*(av>bv?1:av<bv?-1:0):sDir*(bv-av);});
  function th(col,lbl){var s=sCol===col;return '<th class="'+(s?'srt':'')+'" onclick="doSort(\''+col+'\')">'+lbl+'<span class="si">'+(s?(sDir<0?'&#9660;':'&#9650;'):'&#8645;')+'</span></th>';}
  var h='';
  h+='<div class="vkpis"><div class="kpi"><div class="n">'+entries.length+'</div><div class="l">Clientes</div></div>';
  h+='<div class="kpi r"><div class="n">'+cC+'</div><div class="l">Gap Top 10</div></div>';
  h+='<div class="kpi o"><div class="n">'+tO+'</div><div class="l">Oportunidades</div></div>';
  h+='<div class="kpi g"><div class="n">'+tA+'</div><div class="l">Ativados</div></div></div>';
  h+='<div class="pgwrap"><div class="pglbl"><span>Progresso geral</span><span>'+(tA+tN)+' / '+tG+' ('+pct+'%)</span></div>';
  h+='<div class="pgbar"><div class="pgfill" style="width:'+pct+'%"></div></div></div>';
  h+='<div class="stl">Clientes &#8212; oportunidades por prioridade</div>';
  h+='<div class="tbl-wrap"><table><thead><tr>';
  var sN=sCol==='name';
  h+='<th class="'+(sN?'srt':'')+'" onclick="doSort(\'name\')" style="text-align:left">CLIENTE<span class="si">'+(sN?(sDir<0?'&#9660;':'&#9650;'):'&#8645;')+'</span></th>';
  h+=th('fat','FAT 6M')+th('t10','&#128308; T10')+th('t25','&#128992; T25')+th('t50','&#128151; T50')+th('t80','&#128995; T80')+th('add','&#9989; ADD')+th('open','OPOR.');
  h+='</tr></thead><tbody>';
  sorted.forEach(function(e){
    var c=e[0],info=e[1],st=state[K(curV,c)]||{};
    var t10=info.g.filter(function(g){return g.r<=10&&!st[g.r];}).length;
    var t25=info.g.filter(function(g){return g.r>10&&g.r<=25&&!st[g.r];}).length;
    var t50=info.g.filter(function(g){return g.r>25&&g.r<=50&&!st[g.r];}).length;
    var t80=info.g.filter(function(g){return g.r>50&&!st[g.r];}).length;
    var add=info.g.filter(function(g){return st[g.r]==='add';}).length;
    var open=info.g.filter(function(g){return !st[g.r];}).length;
    var cn=c.length>20?c.substring(0,19)+'\u2026':c,idx=cidx(curV,c);
    h+='<tr onclick="selectByIdx('+idx+')">';
    h+='<td title="'+c.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+cn+'</td>';
    h+='<td style="font-size:11px;color:var(--muted)">'+fmtS(info.f)+'</td>';
    h+='<td>'+(t10>0?'<span class="cnt r">'+t10+'</span>':'-')+'</td>';
    h+='<td>'+(t25>0?'<span class="cnt o">'+t25+'</span>':'-')+'</td>';
    h+='<td>'+(t50>0?'<span class="cnt s">'+t50+'</span>':'-')+'</td>';
    h+='<td>'+(t80>0?'<span class="cnt p">'+t80+'</span>':'-')+'</td>';
    h+='<td>'+(add>0?'<span class="cnt gn">'+add+'</span>':'-')+'</td>';
    h+='<td style="font-weight:700;color:'+(open>0?'var(--text)':'var(--muted)')+'">'+open+'</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  document.getElementById('main').innerHTML=h;
}
function renderCliente(){
  var info=(D[curV]||{})[curC];if(!info)return;
  var k=K(curV,curC);if(!state[k])state[k]={};
  var st=state[k],gaps=info.g,total=gaps.length;
  var nA=gaps.filter(function(g){return st[g.r]==='add';}).length;
  var nN=gaps.filter(function(g){return st[g.r]==='na';}).length;
  var nO=total-nA-nN,nC=gaps.filter(function(g){return g.r<=10&&!st[g.r];}).length;
  var nH=gaps.filter(function(g){return g.r>10&&g.r<=25&&!st[g.r];}).length;
  var pct=total>0?Math.round((nA+nN)/total*100):0;
  var fil;
  if(curFilter==='top10')fil=gaps.filter(function(g){return g.r<=10;});
  else if(curFilter==='top25')fil=gaps.filter(function(g){return g.r<=25;});
  else if(curFilter==='open')fil=gaps.filter(function(g){return !st[g.r];});
  else if(curFilter==='add')fil=gaps.filter(function(g){return st[g.r]==='add';});
  else if(curFilter==='na')fil=gaps.filter(function(g){return st[g.r]==='na';});
  else fil=gaps;
  var h='';
  h+='<div class="clichdr"><h2>'+curC+'</h2><div class="climeta">';
  h+='<div class="mb">&#128176; Fat 6M <span>'+fmtR(info.f)+'</span></div>';
  h+='<div class="mb">&#128203; Total <span>'+total+'</span></div>';
  h+='<div class="mb">&#9889; Abertos <span>'+nO+'</span></div>';
  h+='</div></div>';
  h+='<div class="pgwrap"><div class="pglbl"><span>Progresso</span><span>'+(nA+nN)+' / '+total+' ('+pct+'%)</span></div>';
  h+='<div class="pgbar"><div class="pgfill" style="width:'+pct+'%"></div></div></div>';
  h+='<div class="spills"><div class="sp r"><span class="n">'+nC+'</span><span class="l">Top 10</span></div>';
  h+='<div class="sp o"><span class="n">'+nH+'</span><span class="l">Top 25</span></div>';
  h+='<div class="sp g"><span class="n">'+nA+'</span><span class="l">ADD</span></div>';
  h+='<div class="sp p"><span class="n">'+nN+'</span><span class="l">N/A</span></div></div>';
  h+='<div class="tabs">';
  var tds=[['all','Todos ('+total+')'],['open','&#9889; Abertos ('+nO+')'],['top10','&#128308; Top 10'],['top25','&#128992; Top 25'],['add','&#9989; ADD ('+nA+')'],['na','&#128683; N/A ('+nN+')']];
  tds.forEach(function(td){h+='<div class="tab'+(curFilter===td[0]?' act':'')+'" onclick="setFilter(\''+td[0]+'\')">'+td[1]+'</div>';});
  h+='</div>';
  h+='<div class="leg"><div class="ltl">Prioridade de cadastro</div><div class="litems">';
  h+='<div class="li"><div class="ld" style="background:var(--red)"></div>Top 10 &#8212; Cr&#237;tico</div>';
  h+='<div class="li"><div class="ld" style="background:var(--gold)"></div>Top 11&#8211;25 &#8212; Alta</div>';
  h+='<div class="li"><div class="ld" style="background:var(--salmon)"></div>Top 26&#8211;50 &#8212; M&#233;dia</div>';
  h+='<div class="li"><div class="ld" style="background:var(--purple)"></div>Top 51&#8211;80 &#8212; Baixa</div>';
  h+='</div></div>';
  h+='<div class="stl">Itens ('+fil.length+')</div>';
  if(fil.length===0){h+='<div class="ph" style="padding:30px 0"><div class="ico">&#127881;</div><h3>Tudo certo!</h3><p>Nenhum item neste filtro.</p></div>';}
  else{
    h+='<div class="glist">';
    fil.forEach(function(g){
      var pc=pClass(g.r),pl=pLabel(g.r),iA=st[g.r]==='add',iN=st[g.r]==='na';
      var ec=iA?' done-c':iN?' na-c':'';
      h+='<div class="gc '+pc+ec+'"><div class="rb">#'+g.r+'</div>';
      h+='<div class="gi"><div class="gn">'+g.d+'</div><div class="gcat">'+g.c+'</div>';
      h+='<div class="gst"><div class="pill">'+pl+'</div><div class="pill">Penetra&#231;&#227;o <strong>'+g.p+'%</strong></div></div></div>';
      h+='<div class="abns"><button class="ab add'+(iA?' act':'')+'" onclick="act('+g.r+',\'add\')">'+(iA?'&#10003; ADD':'&#65291; ADD')+'</button>';
      h+='<button class="ab na'+(iN?' act':'')+'" onclick="act('+g.r+',\'na\')">'+(iN?'&#10005; N/A':'&#128683; N/A')+'</button></div></div>';
    });
    h+='</div>';
  }
  document.getElementById('main').innerHTML=h;
}
function act(rank,action){
  var k=K(curV,curC);if(!state[k])state[k]={};
  if(state[k][rank]===action)delete state[k][rank];else state[k][rank]=action;
  save();var sy=window.scrollY;renderCliente();window.scrollTo(0,sy);updateSelOpt();
  var cur=(state[K(curV,curC)]||{})[rank];
  toast(cur==='add'?'&#9989; Marcado como ADD':cur==='na'?'&#128683; Marcado como N/A':'Marca&#231;&#227;o removida');
}
function updateSelOpt(){
  var sel=document.getElementById('selC'),info=(D[curV]||{})[curC];if(!info)return;
  var st=state[K(curV,curC)]||{},open=info.g.filter(function(g){return !st[g.r];}).length;
  for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===curC){sel.options[i].textContent=curC+' ('+open+')';break;}}
}
function toast(msg){var t=document.getElementById('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}

</script>
</body>
</html>
